name: Backend main branch build & publish

on:
  push:
    branches: [main]
    paths:
      - 'neobank-backend/**'
      - '.github/workflows/backend-main.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backend-main-${{ github.ref }}
  cancel-in-progress: false # never cancel a partway-through image publish

defaults:
  run:
    working-directory: neobank-backend

jobs:
  test:
    name: Build & test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Set up JDK 21
        uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: neobank-backend/pom.xml

      - name: Unit + integration tests (Testcontainers needs Docker, already on this runner)
        run: ./mvnw -B verify

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: backend-test-reports
          path: |
            neobank-backend/target/surefire-reports/**
            neobank-backend/target/failsafe-reports/**
          retention-days: 14

      - name: Package
        run: ./mvnw -B package -DskipTests

      - name: Upload jar
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: neobank-backend-jar
          path: neobank-backend/target/*.jar
          retention-days: 14

  docker:
    name: Build & push Docker image
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
      id-token: write
      security-events: write
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build image (local, for scanning)
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: neobank-backend
          load: true
          tags: ghcr.io/${{ github.repository_owner }}/neobank-backend:${{ github.sha }}

      - name: Scan image for vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ghcr.io/${{ github.repository_owner }}/neobank-backend:${{ github.sha }}
          format: sarif
          output: trivy-backend.sarif
          severity: CRITICAL,HIGH
          exit-code: "0"

      - name: Upload Trivy scan results
        uses: github/codeql-action/upload-sarif@48ab28a6f5dbc2a99bf1e0131198dd8f1df78169 # v3.28.0
        with:
          sarif_file: trivy-backend.sarif

      - name: Push image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: neobank-backend
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/neobank-backend:latest
            ghcr.io/${{ github.repository_owner }}/neobank-backend:${{ github.sha }}

      - name: Install cosign
        uses: sigstore/cosign-installer@dc72c7d5c4d10cd6bcb8cf6e3fd625a9e5e537da # v3.7.0

      - name: Sign image (keyless, via GitHub OIDC)
        run: cosign sign --yes ghcr.io/${{ github.repository_owner }}/neobank-backend:${{ github.sha }}
