name: Lambdas PR checks

on:
  pull_request:
    branches: [main]
    paths:
      - 'neobank-lambdas/**'
      - '.github/workflows/lambdas-pr.yml'

permissions:
  contents: read

concurrency:
  group: lambdas-pr-${{ github.ref }}
  cancel-in-progress: true

jobs:
  java-lambdas:
    name: ${{ matrix.lambda }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        lambda:
          - transaction-service
          - transaction-query
          - ledger-writer
          - notification-service
          - analytics-processor
          - kyc-validator
          - lex-fulfillment
    defaults:
      run:
        working-directory: neobank-lambdas/${{ matrix.lambda }}
    env:
      # Every handler builds its AWS SDK client (SNS/DynamoDB/S3/CloudWatch)
      # eagerly in a static initializer, which resolves a region at class-init
      # time - with none configured on the runner this threw SdkClientException
      # before a single test method could run, failing every test in the class.
      # No real AWS calls happen in these unit tests, so any valid region works.
      AWS_REGION: us-east-1
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Set up JDK 17
        uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
          cache-dependency-path: neobank-lambdas/${{ matrix.lambda }}/pom.xml

      - name: Test + package
        run: mvn -B package

      - name: Upload jar
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ matrix.lambda }}-jar
          path: neobank-lambdas/${{ matrix.lambda }}/target/${{ matrix.lambda }}-1.0.0.jar
          retention-days: 14

  fraud-checker:
    name: fraud-checker (Python)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: neobank-lambdas/fraud-checker
    env:
      # boto3.resource('dynamodb') at module import time resolves a region
      # immediately - pytest's collection of test_lambda_function.py imports
      # the module, so with no region configured it failed before any test
      # could even be collected, let alone run. botocore's env-var provider
      # reads AWS_DEFAULT_REGION, not AWS_REGION (unlike the AWS SDK for
      # Java v2, which checks AWS_REGION first) - AWS_REGION alone fixed the
      # Java lambdas but left this job still failing on the same class of bug.
      AWS_REGION: us-east-1
      AWS_DEFAULT_REGION: us-east-1
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Set up Python 3.11
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: neobank-lambdas/fraud-checker/requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Run tests
        run: pytest -v

      - name: Package deployment zip
        run: |
          rm -rf build fraud-checker.zip
          mkdir -p build
          cp lambda_function.py build/
          pip install -r requirements.txt -t build/
          cd build && zip -rq ../fraud-checker.zip .

      - name: Upload zip
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: fraud-checker-zip
          path: neobank-lambdas/fraud-checker/fraud-checker.zip
          retention-days: 14
