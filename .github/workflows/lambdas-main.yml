name: Lambdas main branch build & publish

on:
  push:
    branches: [main]
    paths:
      - 'neobank-lambdas/**'
      - '.github/workflows/lambdas-main.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lambdas-main-${{ github.ref }}
  cancel-in-progress: false # never cancel a partway-through image publish

jobs:
  java-lambdas:
    name: ${{ matrix.lambda }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        lambda:
          - transaction-service
          - transaction-query
          - ledger-writer
          - notification-service
          - analytics-processor
          - kyc-validator
          - lex-fulfillment
    defaults:
      run:
        working-directory: neobank-lambdas/${{ matrix.lambda }}
    env:
      # Every handler builds its AWS SDK client (SNS/DynamoDB/S3/CloudWatch)
      # eagerly in a static initializer, which resolves a region at class-init
      # time - with none configured on the runner this threw SdkClientException
      # before a single test method could run, failing every test in the class.
      # No real AWS calls happen in these unit tests, so any valid region works.
      AWS_REGION: us-east-1
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Set up JDK 17
        uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
          cache-dependency-path: neobank-lambdas/${{ matrix.lambda }}/pom.xml

      - name: Test + package
        run: mvn -B package

      - name: Upload jar
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ matrix.lambda }}-jar
          path: neobank-lambdas/${{ matrix.lambda }}/target/${{ matrix.lambda }}-1.0.0.jar
          retention-days: 14

  fraud-checker:
    name: fraud-checker (Python)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: neobank-lambdas/fraud-checker
    env:
      # boto3.resource('dynamodb') at module import time resolves a region
      # immediately - pytest's collection of test_lambda_function.py imports
      # the module, so with no region configured it failed before any test
      # could even be collected, let alone run. botocore's env-var provider
      # reads AWS_DEFAULT_REGION, not AWS_REGION (unlike the AWS SDK for
      # Java v2, which checks AWS_REGION first) - AWS_REGION alone fixed the
      # Java lambdas but left this job still failing on the same class of bug.
      AWS_REGION: us-east-1
      AWS_DEFAULT_REGION: us-east-1
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Set up Python 3.11
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: neobank-lambdas/fraud-checker/requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Run tests
        run: pytest -v

      - name: Package deployment zip
        run: |
          rm -rf build fraud-checker.zip
          mkdir -p build
          cp lambda_function.py build/
          pip install -r requirements.txt -t build/
          cd build && zip -rq ../fraud-checker.zip .

      - name: Upload zip
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: fraud-checker-zip
          path: neobank-lambdas/fraud-checker/fraud-checker.zip
          retention-days: 14

  docker:
    name: Build & push Docker image (${{ matrix.lambda }})
    needs: [java-lambdas, fraud-checker]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
      id-token: write
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        lambda:
          - transaction-service
          - transaction-query
          - ledger-writer
          - notification-service
          - analytics-processor
          - kyc-validator
          - lex-fulfillment
          - fraud-checker
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      # ghcr.io (and Docker/OCI generally) requires an all-lowercase
      # repository name, but github.repository_owner preserves the account's
      # actual case (Solano204) - used directly, every tag below failed with
      # "repository name must be lowercase".
      - name: Compute lowercase image owner
        run: echo "IMAGE_OWNER=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_ENV"

      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build image (local, for scanning)
        uses: docker/build-push-action@ca052bb54ab0790a636c9b5f226502c73d547a25 # v5
        with:
          context: neobank-lambdas/${{ matrix.lambda }}
          load: true
          tags: ghcr.io/${{ env.IMAGE_OWNER }}/${{ matrix.lambda }}:${{ github.sha }}

      - name: Scan image for vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ghcr.io/${{ env.IMAGE_OWNER }}/${{ matrix.lambda }}:${{ github.sha }}
          format: sarif
          output: trivy-${{ matrix.lambda }}.sarif
          severity: CRITICAL,HIGH
          exit-code: "0"

      - name: Upload Trivy scan results
        uses: github/codeql-action/upload-sarif@48ab28a6f5dbc2a99bf1e0131198dd8f1df78169 # v3.28.0
        with:
          sarif_file: trivy-${{ matrix.lambda }}.sarif
          category: trivy-${{ matrix.lambda }}

      - name: Push image
        uses: docker/build-push-action@ca052bb54ab0790a636c9b5f226502c73d547a25 # v5
        with:
          context: neobank-lambdas/${{ matrix.lambda }}
          push: true
          tags: |
            ghcr.io/${{ env.IMAGE_OWNER }}/${{ matrix.lambda }}:latest
            ghcr.io/${{ env.IMAGE_OWNER }}/${{ matrix.lambda }}:${{ github.sha }}

      - name: Install cosign
        uses: sigstore/cosign-installer@dc72c7d5c4d10cd6bcb8cf6e3fd625a9e5e537da # v3.7.0

      - name: Sign image (keyless, via GitHub OIDC)
        run: cosign sign --yes ghcr.io/${{ env.IMAGE_OWNER }}/${{ matrix.lambda }}:${{ github.sha }}
