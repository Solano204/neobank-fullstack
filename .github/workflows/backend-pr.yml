name: Backend PR checks

on:
  pull_request:
    branches: [main]
    paths:
      - 'neobank-backend/**'
      - '.github/workflows/backend-pr.yml'

permissions:
  contents: read

concurrency:
  group: backend-pr-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: neobank-backend

jobs:
  test:
    name: Build & test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Set up JDK 21
        uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: neobank-backend/pom.xml

      - name: Unit + integration tests (Testcontainers needs Docker, already on this runner)
        run: ./mvnw -B verify

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: backend-test-reports
          path: |
            neobank-backend/target/surefire-reports/**
            neobank-backend/target/failsafe-reports/**
          retention-days: 14

      - name: Package
        run: ./mvnw -B package -DskipTests

      - name: Upload jar
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: neobank-backend-jar
          path: neobank-backend/target/*.jar
          retention-days: 14
